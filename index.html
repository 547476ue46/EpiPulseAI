<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EpiPulseAI</title>

  <link rel="stylesheet" href="style.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

  <header class="nav">
    <div class="logo">EpiPulse<span>AI</span></div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Chat. Analyze. Build with <span>EpiPulseAI</span></h1>
    <p>AI-style dashboard + chatbot + analytics system</p>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search features...">
    </div>
  </section>

  <!-- FEATURES -->
  <section class="features">
    <div class="card">⚡ Fast Performance</div>
    <div class="card">🤖 AI Chat System</div>
    <div class="card">📊 Analytics Dashboard</div>
  </section>

  <!-- DASHBOARD -->
  <section class="dashboard">
    <h2>Analytics Dashboard</h2>

    <div class="charts">
      <canvas id="chart1"></canvas>
      <canvas id="chart2"></canvas>
    </div>
  </section>

  <!-- CHAT -->
  <section class="chat-section">
    <h2>AI Chat Assistant</h2>

    <div class="chat-box" id="chatBox">
      <div class="msg ai">Hello 👋 I am EpiPulseAI</div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </section>

  <footer>
    © 2026 EpiPulseAI
  </footer>

  <script src="script.js"></script>

</body>
</html>
