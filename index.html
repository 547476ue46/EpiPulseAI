<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EpiPulseAI Chat UI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="logo">EpiPulse<span>AI</span></div>
  </header>

  <!-- CHAT AREA -->
  <main class="chat-container" id="chatContainer">

    <div class="msg ai">
      👋 Hi! I am EpiPulseAI. Ask me anything.
    </div>

  </main>

  <!-- INPUT -->
  <footer class="input-area">
    <input type="text" id="userInput" placeholder="Message EpiPulseAI...">
    <button onclick="sendMessage()">Send</button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
